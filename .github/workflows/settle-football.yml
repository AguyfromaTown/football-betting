name: Settle Football Bets

on:
  schedule:
    - cron: '0 2,14,22 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-football-picks
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r football-bot/requirements.txt
      - run: python football-bot/football_bot.py --settle-only
      - name: Commit settlement
        run: |
          git config --local user.email "football-bot@github.com"
          git config --local user.name "Football Bot"
          git add -A
          git diff --staged --quiet || git commit -m "Settle football bets"
          git push
